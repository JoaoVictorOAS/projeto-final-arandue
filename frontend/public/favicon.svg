<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="arandueGrad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle Arredondado -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Haste do 'A' -->
  <path
    d="M 24 80 L 48 22 Q 50 17 52 22 L 76 80"
    stroke="url(#arandueGrad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Seta de Crescimento Financeiro Ascendente -->
  <path
    d="M 28 62 C 40 62, 46 54, 58 42 L 72 26"
    stroke="#10B981"
    stroke-width="7"
    stroke-linecap="round"
  />
  <polygon
    points="70,16 84,24 74,38"
    fill="#10B981"
  />

  <!-- Folha da Sabedoria (Arandu) -->
  <path
    d="M 50 48 Q 66 38 68 56 Q 66 70 48 64"
    fill="none"
    stroke="url(#glowGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
  />
</svg>
